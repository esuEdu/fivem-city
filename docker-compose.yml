services:
  fxserver:
    build:
      context: .
      dockerfile: docker/fxserver/Dockerfile
    image: ghcr.io/esuedu/fivem-city:latest
    # FXServer only ships x86_64 builds (emulated on Apple Silicon)
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
      - "40120:40120/tcp" # txAdmin web panel
    environment:
      # Used to write server-data/secrets.cfg; leave CFX_LICENSE_KEY empty to use your own file
      CFX_LICENSE_KEY: ${CFX_LICENSE_KEY:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # Pre-fills the database step of the txAdmin setup wizard
      TXHOST_DEFAULT_DBHOST: mariadb
      TXHOST_DEFAULT_DBPORT: 3306
      TXHOST_DEFAULT_DBUSER: root
      TXHOST_DEFAULT_DBPASS: ${MYSQL_ROOT_PASSWORD}
      TXHOST_DEFAULT_DBNAME: ${MYSQL_DATABASE}
    # Local dev: run the files from the repo instead of the ones baked into the image
    volumes:
      - txdata:/txData
      - ./artifacts:/opt/fxserver
      - ./server-data:/server-data
    stdin_open: true
    tty: true

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "127.0.0.1:3306:3306" # local access only (HeidiSQL, DBeaver, ...)
    volumes:
      - dbdata:/var/lib/mysql
      # Imported automatically the first time the database is created
      - ./server-data/resources/[qbx]/qbx_core/qbx_core.sql:/docker-entrypoint-initdb.d/qbx_core.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  txdata:
  dbdata:

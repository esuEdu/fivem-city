# ============================================
#  fivem-city — Qbox RP server configuration
#  Settings follow the Qbox txAdmin recipe (server.cfg, ox.cfg, voice.cfg, permissions.cfg),
#  with city_inventory instead of ox_inventory.
# ============================================

# Keys, DB connection and other secrets live in secrets.cfg (gitignored)
exec secrets.cfg

## Network
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

## Server info
sv_hostname "fivem-city | Qbox RP"
sets sv_projectName "fivem-city"
sets sv_projectDesc "A Qbox roleplay city"
sets locale "en-US"
sets tags "roleplay, qbox, serious"
sv_maxclients 48
# load_server_icon logo.png

## Game
## [txAdmin CFG validator]: onesync MUST only be set in the txAdmin settings page.
# set onesync on
sv_enforceGameBuild 3258
sv_scriptHookAllowed 0
set sv_enableNetworkedSounds false
set sv_enableNetworkedScriptEntityStates false
set sv_enableNetworkedPhoneExplosions false
set sv_filterRequestControl 4
setr sv_showBusySpinnerOnLoadingScreen false

## Chat (FXServer's built-in chat, styled by qbx_chat_theme)
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s joined the server"
set qbx_chat:quitMessage "^1%s left the server (%s)"

## Qbox
setr qb_locale "en"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink ""
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
# Off: a script could otherwise replace Player.Functions.AddMoney and skip city_economy
set qbx:allowMethodOverrides "false"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "true"
setr qbx:enableGroupManagement "false"
setr qbx:motd ""

## Inventory: qbx_core checks these. inventory:accounts is left unset so it defaults to ["money"]: the cash item IS the
## player's cash (qbx_core mirrors it into the item, city_economy keeps the ledger).
set inventory:framework "qbx"

## ox_lib / ox_target
setr ox:locale "en"
setr ox:primaryColor blue
setr ox:primaryShade 8
setr ox:userLocales 0
setr ox_target:toggleHotkey 0
setr ox_target:defaultHotkey LMENU
setr ox_target:drawSprite 1
setr ox_target:defaults 1
setr ox_target:debug 0
setr ox_target:leftClick 1

## Other resources
setr illenium-appearance:locale "en"
setr weather_disablecd true
setr loadscreen:externalShutdown true
set loadscreen:primaryColor "#f5c542"
set loadscreen:shadowColor "#1a18077f"

## Voice (pma-voice)
setr voice_useNativeAudio true
setr voice_useSendingRangeOnly true
setr voice_enableUi 1
setr voice_enableProximityCycle 1
setr voice_defaultCycle "GRAVE"
setr voice_defaultRadioVolume 60
setr voice_defaultCallVolume 80
setr voice_defaultVoiceMode 2
setr voice_enableRadios 1
setr voice_enableCalls 1
setr voice_enableSubmix 1
setr voice_enableRadioAnim 1
setr voice_defaultRadio "LMENU"

## Default cfx resources
ensure mapmanager
# FXServer's built-in chat (resources_useSystemChat); it still has to be started
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure hardcap
ensure baseevents

## Core (order matters)
ensure oxmysql
ensure ox_lib
ensure qbx_core
ensure city_ui
ensure city_inventory
# Stand-in that forwards ox_inventory calls to city_inventory ([local]/ox_inventory)
ensure ox_inventory
ensure ox_target

## Resource groups
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]
ensure [maps]
ensure [local]

## Off for the V1 test (the groups above start them; these stop them again). Remove a line to turn it back on.
# Houses, apartments and their garages
stop qbx_properties
# Builder tablet app
stop city_builder
# Militech tuners (staff one first: it depends on the player one)
stop city_militech_staff
stop city_militech

## Permissions
add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace resource.qbx_core command allow
add_ace resource.ox_lib command.add_ace allow
add_ace resource.ox_lib command.remove_ace allow
add_ace resource.ox_lib command.add_principal allow
add_ace resource.ox_lib command.remove_principal allow
add_ace group.admin admin allow
add_ace group.mod mod allow
add_ace group.support support allow
add_principal group.admin group.mod
add_principal group.mod group.support

# Add staff here using their license identifier:
# add_principal identifier.license:xxxxxxxxxxxxxxxx group.admin
add_principal identifier.license:251152dd2b15e976dd1a6503aa5b7e9f04c6ab42 group.admin
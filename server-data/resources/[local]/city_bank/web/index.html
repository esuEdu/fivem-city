<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- First visit: fingerprint registration -->
    <section id="identity" class="identity hidden">
        <div class="identity__steps">
            <span class="identity__step identity__step--done"></span>
            <span class="identity__step identity__step--done"></span>
            <span class="identity__step identity__step--active"></span>
        </div>
        <p class="eyebrow" data-label="identity_step"></p>
        <h1 class="identity__title" data-label="identity_title"></h1>
        <p class="identity__intro" data-label="identity_intro"></p>

        <button id="scanner" class="scanner" type="button">
            <svg class="scanner__ring" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="scanner__track" cx="60" cy="60" r="54"></circle>
                <circle id="scanner-progress" class="scanner__progress" cx="60" cy="60" r="54"></circle>
            </svg>
            <svg class="scanner__print" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-2.6 0-5 1-6.8 2.8a.75.75 0 1 0 1.06 1.06A8.1 8.1 0 0 1 12 4c2.17 0 4.2.85 5.74 2.36a.75.75 0 1 0 1.06-1.06A9.6 9.6 0 0 0 12 2.5Zm0 3a6.5 6.5 0 0 0-6.5 6.5c0 1.6-.37 3.2-1.080 4.63a.75.75 0 1 0 1.34.67A11.8 11.8 0 0 0 7 12a5 5 0 0 1 10 0c0 2.86-.6 5.64-1.78 8.23a.75.75 0 1 0 1.36.62A21.2 21.2 0 0 0 18.5 12 6.5 6.5 0 0 0 12 5.5Zm0 3A3.5 3.5 0 0 0 8.5 12c0 2.64-.73 5.2-2.12 7.42a.75.75 0 1 0 1.27.8A15.5 15.5 0 0 0 10 12a2 2 0 0 1 4 0c0 3.62-.9 7.15-2.6 10.3a.75.75 0 1 0 1.32.71A23.3 23.3 0 0 0 15.5 12 3.5 3.5 0 0 0 12 8.5Zm0 2.75a.75.75 0 0 0-.75.75c0 3.2-.95 6.31-2.74 8.97a.75.75 0 1 0 1.24.84A17.6 17.6 0 0 0 12.75 12a.75.75 0 0 0-.75-.75Z"/></svg>
            <svg class="scanner__check" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.55 17.6 4.4 12.45l1.4-1.4 3.75 3.74 8.65-8.64 1.4 1.4-10.05 10.05Z"/></svg>
        </button>
        <p id="scanner-status" class="identity__status"></p>

        <div class="identity__actions">
            <button id="identity-close" class="btn btn--ghost" type="button" data-label="close"></button>
            <button id="identity-continue" class="btn btn--primary btn--grow" type="button" data-label="identity_continue" disabled></button>
        </div>
    </section>

    <!-- Branch panel -->
    <main id="bank" class="app hidden">
        <aside class="side">
            <div class="side__brand">
                <span id="brand-icon" class="side__logo"></span>
                <div class="side__brand-text">
                    <span class="side__name" data-label="bank_name"></span>
                    <span id="branch" class="side__branch"></span>
                </div>
            </div>
            <nav id="nav" class="side__nav"></nav>
        </aside>

        <section class="main">
            <header class="topbar">
                <div class="topbar__titles">
                    <h1 id="title" class="topbar__title"></h1>
                    <p id="subtitle" class="topbar__subtitle"></p>
                </div>
                <div id="topbar-tools" class="topbar__tools"></div>
                <button id="bank-close" class="ibtn ibtn--large" type="button"></button>
            </header>
            <div id="tab" class="page"></div>
        </section>
    </main>

    <!-- ATM and branch cash desk -->
    <section id="atm" class="overlay hidden"></section>

    <!-- Card machine (customer side) -->
    <section id="pos" class="overlay hidden"></section>

    <div id="modal" class="modal hidden"></div>
    <div id="toast" class="toast hidden"></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>

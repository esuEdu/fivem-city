<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="screen.css">
</head>
<body>
    <section id="arrest" class="arrest hidden" role="dialog" aria-modal="true" aria-labelledby="arrest-title">
        <div class="arrest-card">
            <div class="bars" aria-hidden="true"></div>
            <h1 id="arrest-title"></h1>
            <p class="months" id="arrest-months"></p>
            <p class="fine" id="arrest-fine"></p>
            <h2 id="arrest-charges-label"></h2>
            <ul id="arrest-charges"></ul>
            <p class="officer" id="arrest-officer"></p>
            <button type="button" id="arrest-ok"></button>
        </div>
    </section>

    <section id="camera" class="camera hidden" aria-live="polite">
        <div class="cam-top">
            <span class="rec"><i></i>REC</span>
            <span id="cam-label"></span>
            <span id="cam-time"></span>
        </div>
        <div class="cam-offline hidden" id="cam-offline"></div>
        <div class="cam-bottom" id="cam-help"></div>
    </section>

    <section id="radar" class="radar hidden" aria-live="off">
        <div class="radar-head"><span>PATROL RADAR</span><span id="radar-lock" class="radar-locked hidden"></span></div>
        <div class="radar-row">
            <div class="radar-cell"><small id="radar-own-label"></small><strong class="digits green" id="radar-own-speed">000</strong></div>
            <div class="radar-cell"><small id="radar-front-label"></small><strong class="digits orange" id="radar-front-speed">000</strong></div>
            <div class="radar-cell"><small id="radar-rear-label"></small><strong class="digits red" id="radar-rear-speed">000</strong></div>
            <div class="radar-plates">
                <div class="plate"><small>San Andreas</small><strong id="radar-front-plate">--------</strong></div>
                <div class="plate rear"><strong id="radar-rear-plate">--------</strong></div>
            </div>
        </div>
    </section>

    <div id="popups" class="popups" aria-live="polite"></div>

    <section id="radial" class="radial-wrap hidden" role="dialog" aria-modal="true">
        <div class="radial" id="radial-ring"></div>
    </section>

    <section id="car-menu" class="car-menu hidden" role="dialog" aria-labelledby="car-title">
        <div class="car-head">
            <div><h2 id="car-title"></h2><small id="car-subtitle"></small></div>
            <button type="button" class="car-close" id="car-close" aria-label="Close">&times;</button>
        </div>
        <div class="car-radar" id="car-radar"></div>
        <h3 id="car-codes-label"></h3>
        <div class="car-codes" id="car-codes"></div>
    </section>

    <div id="head-bag" class="head-bag hidden" aria-hidden="true"></div>

    <script src="screen.js"></script>
</body>
</html>

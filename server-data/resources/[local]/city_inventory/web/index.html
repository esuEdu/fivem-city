<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="inventory" class="panel hidden">
        <header class="panel__header">
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4a3 3 0 0 1 6 0v1h1a4 4 0 0 1 4 4v9a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V9a4 4 0 0 1 4-4h1V4Zm2 1h2V4a1 1 0 0 0-2 0v1Zm-2 7a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2H9Z"/></svg>
            </div>
            <h1 id="title" class="panel__title"></h1>
            <div class="panel__tools">
                <label class="search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"/></svg>
                    <input id="search" class="search__input" type="text" autocomplete="off" spellcheck="false">
                </label>
                <input id="qty" class="input input--qty" type="number" min="1" step="1">
            </div>
        </header>

        <div class="capacity">
            <svg class="capacity__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-2.83 4H7.5a2 2 0 0 0-1.96 1.6l-1.9 10A2 2 0 0 0 5.6 21h12.8a2 2 0 0 0 1.96-2.4l-1.9-10A2 2 0 0 0 16.5 7h-1.67A3 3 0 0 0 12 3Zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
            <div class="capacity__bar"><div id="weight-fill" class="capacity__fill"></div></div>
            <span id="weight-text" class="capacity__weight"></span>
            <span id="slots-text" class="capacity__slots"></span>
        </div>

        <nav id="tabs" class="tabs"></nav>

        <div id="hotbar-grid" class="grid grid--hotbar"></div>
        <div class="divider"></div>
        <div id="grid" class="grid"></div>
    </main>

    <main id="other" class="panel panel--right hidden">
        <header class="panel__header">
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v4H3V5a1 1 0 0 1 1-1Zm-1 7h18v8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-8Zm6 2a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2H9Z"/></svg>
            </div>
            <h1 id="other-title" class="panel__title"></h1>
        </header>

        <div id="other-capacity" class="capacity">
            <svg class="capacity__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-2.83 4H7.5a2 2 0 0 0-1.96 1.6l-1.9 10A2 2 0 0 0 5.6 21h12.8a2 2 0 0 0 1.96-2.4l-1.9-10A2 2 0 0 0 16.5 7h-1.67A3 3 0 0 0 12 3Zm0 2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>
            <div class="capacity__bar"><div id="other-weight-fill" class="capacity__fill"></div></div>
            <span id="other-weight-text" class="capacity__weight"></span>
            <span id="other-slots-text" class="capacity__slots"></span>
        </div>

        <div id="other-grid" class="grid"></div>
    </main>

    <main id="trade" class="panel panel--right hidden">
        <header class="panel__header">
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4 2 9l5 5 1.4-1.4L5.8 10H14V8H5.8l2.6-2.6L7 4Zm10 6-1.4 1.4 2.6 2.6H10v2h8.2l-2.6 2.6L17 20l5-5-5-5Z"/></svg>
            </div>
            <div>
                <h1 id="trade-title" class="panel__title"></h1>
                <p id="trade-partner" class="panel__subtitle"></p>
            </div>
            <div class="panel__tools">
                <button id="trade-cancel" class="button" type="button"></button>
            </div>
        </header>

        <section class="trade__side">
            <div class="trade__head">
                <h2 id="offer-title" class="trade__title"></h2>
                <span id="offer-status" class="status"></span>
            </div>
            <div id="offer-grid" class="grid grid--trade"></div>
            <div class="trade__footer">
                <label class="cash">
                    <span class="cash__sign">$</span>
                    <input id="trade-cash" class="cash__input" type="number" min="0" step="1">
                </label>
                <button id="trade-accept" class="button button--accent" type="button"></button>
            </div>
        </section>

        <div class="divider"></div>

        <section class="trade__side">
            <div class="trade__head">
                <h2 id="their-title" class="trade__title"></h2>
                <span id="their-status" class="status"></span>
            </div>
            <div id="their-grid" class="grid grid--trade"></div>
            <div class="trade__footer">
                <span class="cash cash--readonly"><span class="cash__sign">$</span><span id="their-cash" class="cash__value"></span></span>
            </div>
        </section>
    </main>

    <button id="close" class="close hidden" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"/></svg>
    </button>

    <div id="hotbar-popup" class="hotbar-popup hidden"></div>

    <ul id="menu" class="menu hidden"></ul>

    <section id="card" class="card hidden">
        <button id="card-close" class="card__close" type="button" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.7 5.3 12 10.6l5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"/></svg>
        </button>
        <div class="card__head">
            <div class="card__image"><img id="card-image" alt=""></div>
            <div class="card__info">
                <h2 id="card-title" class="card__title"></h2>
                <div id="card-chips" class="card__chips"></div>
            </div>
        </div>
        <div id="card-rows" class="card__rows"></div>
        <div id="card-actions" class="card__actions"></div>
    </section>

    <div id="dialog" class="dialog hidden">
        <div class="dialog__box">
            <h2 id="dialog-title" class="dialog__title"></h2>
            <div class="dialog__item">
                <img id="dialog-image" class="dialog__image" alt="">
                <span id="dialog-label" class="dialog__label"></span>
            </div>
            <div class="dialog__amount">
                <button id="dialog-minus" class="button dialog__step" type="button">-</button>
                <input id="dialog-input" class="input dialog__input" type="number" min="1" step="1">
                <button id="dialog-plus" class="button dialog__step" type="button">+</button>
                <button id="dialog-max" class="button" type="button"></button>
            </div>
            <p id="dialog-total" class="dialog__total"></p>
            <div class="dialog__actions">
                <button id="dialog-cancel" class="button" type="button"></button>
                <button id="dialog-confirm" class="button button--accent" type="button"></button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>

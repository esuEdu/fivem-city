<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>city_hospital</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <section id="downed" class="downed hidden">
        <header class="downed__head">
            <span class="downed__pulse"></span>
            <h1 id="title"></h1>
        </header>
        <p id="hint" class="downed__hint hidden"></p>

        <div class="downed__stats">
            <div class="stat">
                <span id="ems-label" class="stat__label"></span>
                <span id="ems-count" class="stat__value"></span>
            </div>
            <div class="stat stat--wide">
                <span id="coming" class="stat__text"></span>
            </div>
        </div>

        <div id="timer" class="downed__timer hidden">
            <span id="timer-label"></span>
            <strong id="timer-value"></strong>
        </div>

        <ul class="downed__keys">
            <li id="key-respawn" class="key hidden"></li>
            <li id="key-sos" class="key hidden"></li>
            <li id="key-pray" class="key hidden"></li>
        </ul>
    </section>
</body>
</html>

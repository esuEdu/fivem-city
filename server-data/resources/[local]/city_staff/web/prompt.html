<!doctype html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cfx-nui-city_os/web/kit/kit.css">
    <link rel="stylesheet" href="prompt.css">
</head>
<body>
    <div id="rating" class="hidden">
        <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="rating-title">
            <div id="ask">
                <div class="head">
                    <span class="avatar" id="rating-initials"></span>
                    <div class="who">
                        <strong id="rating-title"></strong>
                        <small id="rating-text"></small>
                    </div>
                </div>
                <div class="stars" id="rating-stars"></div>
                <div class="word" id="rating-word"></div>
                <div class="tags" id="rating-tags"></div>
                <label class="comment"><span id="rating-comment-label"></span>
                    <textarea id="rating-comment" rows="2" maxlength="200"></textarea>
                </label>
                <div class="buttons">
                    <button class="kit-btn" id="rating-skip"></button>
                    <span class="spacer"></span>
                    <button class="kit-btn accent" id="rating-send" disabled></button>
                </div>
            </div>
            <div id="thanks" class="hidden">
                <span class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
                <strong id="thanks-title"></strong>
                <small id="thanks-text"></small>
            </div>
        </section>
    </div>
    <script type="module" src="js/prompt.js"></script>
</body>
</html>

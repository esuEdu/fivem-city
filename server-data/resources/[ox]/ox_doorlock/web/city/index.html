<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Door locks</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="panel" class="panel hidden" role="dialog" aria-modal="true" aria-labelledby="title">
        <header class="head">
            <button type="button" class="icon-btn hidden" id="back" aria-label="Back to the list">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <div class="titles">
                <h1 id="title">Door locks</h1>
                <small id="subtitle"></small>
            </div>
            <div class="head-actions" id="head-actions"></div>
            <button type="button" class="icon-btn close" id="close" aria-label="Close">&times;</button>
        </header>
        <main class="body" id="body"></main>
    </section>
    <div class="toast hidden" id="toast" role="status"></div>
    <script src="app.js"></script>
</body>
</html>
